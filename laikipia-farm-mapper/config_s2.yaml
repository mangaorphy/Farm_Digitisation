# Sentinel-2 (10 m, free, no login) as the main image, for when no high-resolution imagery is available.
# Only the settings that differ from config.yaml are here. Use with --config config_s2.yaml, e.g.
#   python -m farmmap sentinel2 --period 2025-H1 --config config_s2.yaml
#   python -m farmmap ingest --config config_s2.yaml
#   python -m farmmap tiles  --config config_s2.yaml
# The image is a cloud-free DE Africa GeoMAD composite. At 10 m a farm of 0.5 ha is only ~50 pixels and a fence
# is invisible, so expect good results for larger fields and misses / merges among small adjacent plots.
base: config.yaml

paths:
  imagery_raw: data/imagery/raw_s2
  scenes: data/imagery/scenes_s2
  mosaic: data/imagery/mosaic_s2.vrt
  tiles: data/tiles_s2
  models: data/models_s2
  outputs: outputs/s2

imagery:
  gsd_m: 5                            # 10 m composite resampled to 5 m so a boundary line is 2 pixels wide
  bands: auto                         # the export writes blue, green, red, nir band names
  pansharpen: false
  stretch_percentiles: [0.5, 99.5]

tiles:
  size_px: 256                        # 1.28 km chips
  boundary_width_m: 10                # one Sentinel-2 pixel
  block_m: 2000

predict:
  tile_px: 256
  overlap_px: 64
  chunk_px: 2048

polygonize:
  min_area_m2: 2000                   # 0.2 ha = 20 Sentinel-2 pixels; anything smaller cannot be resolved
  hole_area_m2: 2000
  simplify_m: 5
  block_px: 2048
  halo_px: 256
