# Laikipia farm digitisation: high-resolution (Vantor Legion, ~0.3 m) imagery → U-Net → farm polygons.
# Paths are relative to this file. Every command takes --config to point at another copy.

paths:
  labels: data/labels/manual          # your Google Earth Pro KMZ/KML (+ any GPKG/SHP/GeoJSON) live here
  aoi: data/aoi/aoi.geojson           # written by `python -m farmmap aoi` (fence corridor + training parcels)
  imagery_raw: data/imagery/raw       # put the SDX downloads here, unchanged (GeoTIFF / NITF, any sub-folders)
  scenes: data/imagery/scenes         # ingest writes one aligned, 8-bit GeoTIFF per scene here
  mosaic: data/imagery/mosaic.vrt     # ...and a VRT that stitches them (newest scene on top)
  tiles: data/tiles                   # training chips + masks (zip this folder for Kaggle)
  models: data/models
  outputs: outputs

# Working area. `python -m farmmap aoi` writes paths.aoi = fence corridor ∪ training-parcel area, plus the
# small SDX search boxes. When that file exists it replaces `bbox` (the old pilot box, kept as a fallback).
aoi:
  bbox: [36.45, 0.00, 36.75, 0.30]
  crs: EPSG:32637                     # UTM 37N, metres (Laikipia lies in zone 37)
  fence_layers:                       # the West Laikipia Fence is split over two files: use both
    - path: data/aoi/fences/Laikipia Fences.shp
      where: {Fence: [WLF]}           # LNC, Mugie and Ol Pejeta sections
    - path: data/aoi/fences/WLF.shp   # central section
  fence_buffer_m: 5000
  include_labels:                     # also cover these training parcels so the model has imagery to learn from
    SOURCE: [Digitized]               # traced parcels (incl. your new farms), not the scheme layer
  label_buffer_m: 300
  search_box_km: 20                   # SDX searches by box only: 19 boxes cover the corridor

labels:
  # Parcels that do NOT match these filters are not thrown away: they become "ignore" pixels
  # (not farm, not background, not scored), because they are still real farms.
  keep:
    QA_FLAG: [OK]
    SOURCE: [Digitized, Scheme layer]  # use [Digitized] if `check` shows the scheme layer is misregistered
  # Groups taken out of training (also become "ignore" pixels), e.g. schemes `check` calls SHIFTED/UNCLEAR.
  # Values must match the CSV exactly. The 5 below were flagged by an earlier registration check (118 parcels).
  drop:
    SCHEME: ["G.L.(Rumuruti Forest", "G.L.(Rware)", "Maundu ni meri Outspan", "Ndindika SFT", "Thome Outspan"]
  # Polygons drawn in the "New farms" folder have no SOURCE/QA_FLAG; they get these values
  defaults:
    SOURCE: Digitized
    QA_FLAG: OK
  # Pixels further than this from any parcel are ignored: your file does not cover every farm,
  # so "no polygon here" is only trusted as background close to mapped farms.
  context_m: 30
  # Optional per-group shifts (metres, east/north) to fix misregistered scheme plans.
  # `python -m farmmap check` writes suggested values to outputs/registration_shifts.yaml.
  shift_by: SCHEME
  shifts: {}

imagery:
  gsd_m: 0.5                          # training/prediction pixel size. 0.3 m native is ~3x slower for little gain on fences
  bands: auto                         # or 1-based indices of [R, G, B, NIR] in the multispectral file, e.g. [5, 3, 2, 7]
  use_nir: true                       # NIR helps separate crops from grass/bush; set false for RGB-only products
  pansharpen: auto                    # auto = sharpen when a PAN file is found next to its MS file
  rpc_height_m: 1800                  # used only for un-orthorectified files with RPCs and no DEM
  dem: null                           # optional DEM GeoTIFF for RPC orthorectification (better on slopes)
  stretch_percentiles: [1, 99]        # per-scene contrast stretch to 8 bit (0 is reserved for nodata)
  newest_on_top: true

tiles:
  size_px: 512                        # 256 m at 0.5 m
  boundary_width_m: 1.5               # width of the "boundary" class drawn along every parcel outline
  min_label_fraction: 0.10            # skip chips where less than this share is labelled (non-ignore)
  max_nodata_fraction: 0.30
  block_m: 2000                       # train/val/test split is by 2 km map blocks, so test areas are truly unseen
  split: {train: 0.70, val: 0.15, test: 0.15}
  seed: 42

model:
  arch: Unet                          # any segmentation_models_pytorch architecture (Unet, UnetPlusPlus, FPN...)
  encoder: resnet34
  encoder_weights: imagenet           # pretrained encoder; matters a lot with ~10k parcels

train:
  epochs: 40                          # upper limit; with `patience` training stops earlier once it plateaus
  patience: null                      # e.g. 15: stop after 15 epochs without a val mIoU gain > min_delta
  min_delta: 0.002
  batch_size: 16                      # Kaggle T4/P100 (16 GB): 16 at 512 px
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 2
  amp: true                           # mixed precision on GPU
  class_weights: [1.0, 1.0, 3.0]      # background, interior, boundary (boundaries are thin, so up-weighted)
  dice_weight: 1.0
  seed: 42                            # fixed so experiments A/B/C differ only in their labels

predict:
  tile_px: 512
  overlap_px: 128
  chunk_px: 2048                      # processed in chunks so any area fits in RAM
  batch_size: 8

polygonize:
  marker_threshold: 0.55              # interior minus boundary above this seeds one farm
  mask_threshold: 0.45                # interior + boundary above this is "inside some farm"
  min_area_m2: 300                    # drop slivers (0.03 ha)
  hole_area_m2: 300                   # fill holes smaller than this
  simplify_m: 0.75
  block_px: 4096
  halo_px: 1024                       # farms bigger than about halo x gsd may be split, then merged across blocks

evaluate:
  iou_match: 0.5
  # Parcels the model is scored against, independent of what it was trained on, so experiments with
  # different training labels are compared on the same trusted (hand-traced) reference.
  reference:
    QA_FLAG: [OK]
    SOURCE: [Digitized]
