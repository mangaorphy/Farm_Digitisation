# Laikipia farm digitisation: single configuration file.
# Paths are relative to this file. Every command and the notebook read this file.

project:
  crs: EPSG:32637          # UTM 37N; covers all of Laikipia. Areas are computed in this CRS.
  resolution_m: 10         # Sentinel-2 native resolution for the visible/NIR bands

# --- Area to map: the Laikipia County boundary (downloaded automatically on first use) ---
aoi:
  county_name: Laikipia
  county_boundary: data/aoi/laikipia_county.geojson

# --- Reference polygons: YOUR farm polygons digitised in Google Earth Pro ---
# These are the training labels and the evaluation truth. Export them from Google Earth Pro as
# KML/KMZ (right-click folder > Save Place As) and drop the files in data/labels/manual/.
# .shp / .gpkg / .geojson also work. All files there are used automatically.
reference:
  polygons: []
  extra_dirs:
    - data/labels/manual
  name_field: FARM_ID
  # Parcels failing these filters are IGNORED (not used as labels, not scored, not learned as
  # background). QA_FLAG != OK are the parcels your file marks as having an open data check.
  # Add SOURCE: [Digitized] to train only on parcels traced from imagery (see README).
  filters:
    QA_FLAG: [OK]
  # Pixels further than this from any reference polygon are IGNORED in training/evaluation
  # (so partially digitised areas do not teach the model that unlabelled farms are background).
  coverage_buffer_m: 250

# --- Imagery ---
imagery:
  # planetary_computer = free Sentinel-2 L2A, no account or API key needed.
  # local = use your own GeoTIFF (e.g. licensed high-resolution imagery) at `local_path`.
  source: planetary_computer
  local_path: null
  local_bands: null          # e.g. [B, G, R, NIR]; needed only for local files with NDVI
  output: data/imagery/laikipia_s2.tif   # main training composite
  dir: data/imagery          # every other .tif here is an extra scene (used for training + retraining)
  collection: sentinel-2-l2a
  bands: [B02, B03, B04, B08, B11, B12]
  date_range: ["2024-01-01", "2024-03-31"]   # dry season: fewest clouds, strongest field contrast
  max_cloud_cover: 30        # scene-level %, pre-filter
  max_scenes_per_tile: 6     # least-cloudy scenes per Sentinel-2 tile used in the median
  chunk_px: 1024             # processing chunk (keeps memory low, enables resume)
  # Pilot area [min_lon, min_lat, max_lon, max_lat]. Set to null for the whole county
  # (~13,000 x 12,000 px; plan for many GB of downloads and several hours).
  # Best practice: set this to a box around the farms you have digitised.
  bbox: [36.45, 0.00, 36.75, 0.30]   # densest area of your digitised farms (~8,000 parcels)

labels:
  dir: data/labels           # <scene>_labels.tif is written here for every scene
  boundary_width_px: 1       # width of the "boundary" class. Small parcels need thin lines (1 px = 10 m)

# --- Spatial hold-out: whole blocks are assigned to train / val / test ---
split:
  block_px: 512              # 5 km blocks
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 42
  file: data/labels/split.json   # persisted so the test set stays fixed when you retrain

model:
  encoder: resnet18          # light enough for a CPU laptop. resnet34 is a bit more accurate, ~2x slower
  encoder_weights: imagenet  # downloaded on first use; set null to train from scratch offline
  checkpoint: data/models/unet_best.pt
  add_ndvi: true

train:
  crop_px: 256
  batch_size: 8
  epochs: 20
  steps_per_epoch: 100
  val_crops: 160
  lr: 0.0003
  finetune_lr: 0.0001        # used when retraining from an existing checkpoint
  weight_decay: 0.0001
  class_weights: [1.0, 1.0, 3.0]   # background, farm interior, boundary
  patience: 8                # early stopping (epochs without val improvement)
  num_workers: 0
  device: auto               # auto | cuda | mps | cpu
  seed: 42

predict:
  tile_px: 512
  pad_px: 64                 # context discarded around each tile to avoid edge artefacts
  tta: true                  # average over horizontal/vertical flips

polygonize:
  interior_threshold: 0.5    # P(interior) needed to seed a farm
  boundary_threshold: 0.4    # P(boundary) above this splits neighbouring farms
  min_area_ha: 0.1           # smallest polygon kept (0.1 ha = 1,000 m2)
  simplify_m: 3
  fill_holes_ha: 0.02
  seed_opening: false        # true removes speckle but also deletes parcels narrower than 3 px

# Delineate Anything (optional engine): needs `pip install -r requirements-da.txt`
delineate:
  weights: data/models/DelineateAnythingv2.pt
  weights_url: https://huggingface.co/MykolaL/DelineateAnything/resolve/main/DelineateAnythingv2.pt
  upsample: 2                # Sentinel-2 is resampled up before detection; compare 1, 2, 4 with `compare`
  tile_px: 512               # tile size at native resolution
  overlap_px: 64
  imgsz: 640
  conf: 0.2
  iou: 0.5
  stretch_percentiles: [2, 98]

outputs:
  dir: outputs
  kmz_name: laikipia_farm_polygons
